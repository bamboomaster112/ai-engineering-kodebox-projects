name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    # Everything here runs with the offline fake model: no KodeKey key, no tokens, no web access needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.32"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint (ruff, including security rules)
        run: uv run ruff check src tests setup
      - name: Unit and integration tests (offline)
        run: uv run pytest
      - name: Static security scan (bandit)
        run: uv run bandit -q -r src -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.lock.txt
          uv run pip-audit -r requirements.lock.txt --disable-pip --no-deps
