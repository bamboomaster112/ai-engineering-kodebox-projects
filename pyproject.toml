[project]
name = "aidesk"
version = "0.1.0"
description = "AI Desk: an LLM playground, a RAG support bot, an Ask-the-Web agent and a Deep Research agent with MCP and A2A, built and tested on a KodeKloud AI Engineering KodeBox."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "openai>=3.33",
  "langgraph>=1.2.16,<2",
  "langgraph-checkpoint-sqlite>=3.1",
  "mcp>=2.3,<3",
  "a2a-sdk[http-server]>=1.3,<2",
  "fastapi>=0.143",
  "uvicorn>=0.54",
  "httpx>=0.28",
  "numpy>=2",
  "pydantic>=2.14",
  "python-dotenv>=1.2",
  "ddgs>=9.16",
  "trafilatura>=2.3",
  "opentelemetry-sdk>=1.45",
]

[project.scripts]
aidesk = "aidesk.cli:main"

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1",
  "ruff>=0.14",
  "bandit>=1.8",
  "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -m 'not live and not e2e'"
markers = [
  "live: calls KodeKey and spends tokens (run on the KodeBox)",
  "e2e: needs the running AI Desk services",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"setup/**" = ["S"]
