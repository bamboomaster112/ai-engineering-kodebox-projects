# AI Desk behind the KodeBox nginx (included from /etc/nginx/kodebox.d/).
# Only the web app is public, behind basic auth. MCP (8001) and A2A (8002) stay on 127.0.0.1.
location = /app { return 301 /app/; }
location /app/ {
    auth_basic "AI Desk";
    auth_basic_user_file /etc/nginx/aidesk.htpasswd;
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # stream agent progress (server-sent events) as it happens
    proxy_read_timeout 600s;      # deep research runs can take a few minutes
    client_max_body_size 64k;
}
